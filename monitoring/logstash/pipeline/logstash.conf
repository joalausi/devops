input {
  beats { port => 5044 }
}

filter {
  if [application][service] {
    mutate { add_field => { "[@metadata][target_index]" => "application-logs-%{+YYYY.MM.dd}" } }
  } else if [log_category] == "docker" {
    mutate { add_field => { "[@metadata][target_index]" => "docker-logs-%{+YYYY.MM.dd}" } }
  } else {
    mutate { add_field => { "[@metadata][target_index]" => "system-logs-%{+YYYY.MM.dd}" } }
  }

  # Match structured application errors and common fatal patterns. Filebeat's
  # decode_json_fields processor preserves malformed JSON in the original
  # message and adds an error field, so parsing failures remain searchable.
  if [application][level] in ["error", "fatal"] or [message] =~ /(?i)(fatal|panic|out of memory|segmentation fault)/ {
    mutate { add_tag => ["log_pattern_alert"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200", "http://elasticsearch-2:9200"]
    index => "%{[@metadata][target_index]}"
  }

  # Log-pattern alerts enter the same Alertmanager routing, grouping and
  # throttling flow as metric alerts. The full event remains in Elasticsearch.
  if "log_pattern_alert" in [tags] {
    http {
      url => "http://alertmanager:9093/api/v2/alerts"
      http_method => "post"
      format => "message"
      content_type => "application/json"
      message => '[{"labels":{"alertname":"LogPatternDetected","severity":"warning","source":"logstash","instance":"%{[vm_name]}"},"annotations":{"summary":"Error or fatal log pattern detected by Logstash","description":"Inspect %{[@metadata][target_index]} in Kibana"},"startsAt":"%{@timestamp}"}]'
    }
  }

}
